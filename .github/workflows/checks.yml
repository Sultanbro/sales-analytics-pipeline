name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: pip install pip-audit && pip-audit -r requirements.txt
  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/setup.py
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python3 scripts/demo.py
      - name: Two independent workers
        run: docker compose up -d --scale worker=2 && python3 scripts/demo.py
      - if: always()
        run: docker compose logs && docker compose down -v

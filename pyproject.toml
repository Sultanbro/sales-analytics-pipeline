[project]
name = "sales-analytics-pipeline"
version = "1.0.0"
description = "Tenant-isolated sales profiling with a durable background job queue"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
